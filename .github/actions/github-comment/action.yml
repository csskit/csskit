name: "GitHub Comment"
description: "Post a comment on a PR or issue, with ${VAR} substitution from env"
inputs:
  body:
    description: "Comment body. Use ${ENV_VAR} for substitution from environment."
    required: true
  issue-number:
    description: "PR or issue number to comment on"
    required: true
  token:
    description: "GitHub token or PAT. Defaults to the built-in github.token."
    required: false
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - name: Post comment
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        COMMENT_BODY: ${{ inputs.body }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
      run: |
        printf '%s' "$COMMENT_BODY" | envsubst > /tmp/comment-body.md
        gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment-body.md
