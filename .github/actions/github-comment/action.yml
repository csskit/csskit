name: "GitHub Comment"
description: "Queue a PR comment, with ${VAR} substitution from env. Uploads it as the pr-comment artifact, which the PR Comment workflow posts."
inputs:
  body:
    description: "Comment body. Use ${ENV_VAR} for substitution from environment."
    required: true
runs:
  using: "composite"
  steps:
    - name: Render comment
      shell: bash
      env:
        COMMENT_BODY: ${{ inputs.body }}
      run: |
        mkdir -p "$RUNNER_TEMP/pr-comment"
        printf '%s' "$COMMENT_BODY" | envsubst > "$RUNNER_TEMP/pr-comment/comment.md"

    - name: Upload comment
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pr-comment
        path: ${{ runner.temp }}/pr-comment/comment.md
        overwrite: true
