name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  fuzz:
    name: Fuzz parse_stylesheet
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
      contents: write
    steps:
      - name: Setup
        uses: ./.github/actions/setup
        with:
          nightly: "true"

      - name: Run fuzzer
        # Continue on error so we can collect artifacts even on crash/timeout finds.
        continue-on-error: true
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run parse_stylesheet \
            corpus/parse_stylesheet \
            --target x86_64-unknown-linux-gnu \
            -- -max_total_time=300 -max_len=4096 \
            -artifact_prefix=artifacts/parse_stylesheet/

      - name: Minimise artifacts
        # For each crash/timeout, run tmin to produce a minimal reproducer.
        working-directory: fuzz
        run: |
          shopt -s nullglob
          mkdir -p artifacts/parse_stylesheet
          for f in artifacts/parse_stylesheet/{crash,timeout,slow}-*; do
            echo "Minimising $f"
            cargo +nightly fuzz tmin parse_stylesheet "$f" \
              --target x86_64-unknown-linux-gnu \
              -- -max_total_time=30 || true
          done

      - name: Collect coverage
        continue-on-error: true
        working-directory: fuzz
        run: |
          cargo +nightly fuzz coverage parse_stylesheet corpus/parse_stylesheet \
            --target x86_64-unknown-linux-gnu

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-coverage
          path: fuzz/coverage/
          if-no-files-found: ignore

      - name: Check for new findings
        id: findings
        run: |
          shopt -s nullglob
          findings=(fuzz/artifacts/parse_stylesheet/{crash,timeout,slow}-*)
          if [ ${#findings[@]} -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Found ${#findings[@]} artifact(s):"
            for f in "${findings[@]}"; do echo "  $f"; done
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No new findings."
          fi

      - name: Stage findings
        if: steps.findings.outputs.found == 'true'
        run: |
          BRANCH="fuzz/findings-$(date +%Y%m%d-%H%M%S)"
          DATE=$(date +%Y-%m-%d)
          echo "FUZZ_BRANCH=${BRANCH}" >> $GITHUB_ENV
          echo "FUZZ_DATE=${DATE}" >> $GITHUB_ENV
          echo "RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV

          git switch -c "$BRANCH"
          shopt -s nullglob
          for f in fuzz/artifacts/parse_stylesheet/{crash,timeout,slow}-*; do
            cp "$f" "fuzz/corpus/parse_stylesheet/$(basename "$f")"
          done
          git add fuzz/corpus/parse_stylesheet/

      - name: Open PR with findings
        if: steps.findings.outputs.found == 'true'
        uses: ./.github/actions/create-pr
        with:
          token: ${{ secrets.GENERATE_VALUES_GITHUB_PAT }}
          branch: ${{ env.FUZZ_BRANCH }}
          commit-message: "fuzz: add new findings from nightly run ${{ env.FUZZ_DATE }}"
          title: "fuzz: new parser findings ${{ env.FUZZ_DATE }}"
          body: |
            Nightly fuzz run found new findings.

            Reproduce: `mise run fuzz`. Fix the bug, add a regression test, then merge.

            GHA run: ${RUN_URL}
