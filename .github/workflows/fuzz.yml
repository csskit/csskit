name: Fuzz
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  fuzz:
    name: Fuzz parse_stylesheet
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: "true"

      - name: Install nightly Rust
        run: rustup toolchain install nightly --component llvm-tools-preview

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.1 --locked

      - name: Run fuzzer
        # Continue on error so we can collect artifacts even on crash/timeout finds.
        continue-on-error: true
        run: |
          cargo +nightly fuzz run parse_stylesheet \
            fuzz/corpus/parse_stylesheet \
            -- -max_total_time=300 -max_len=4096 -artifact_prefix=fuzz/artifacts/parse_stylesheet/
        working-directory: fuzz

      - name: Minimise artifacts
        # For each crash/timeout, run tmin to produce a minimal reproducer.
        run: |
          shopt -s nullglob
          mkdir -p fuzz/artifacts/parse_stylesheet
          for f in fuzz/artifacts/parse_stylesheet/{crash,timeout,slow}-*; do
            echo "Minimising $f"
            cargo +nightly fuzz tmin parse_stylesheet "$f" \
              -- -max_total_time=30 || true
          done
        working-directory: fuzz

      - name: Collect coverage
        continue-on-error: true
        run: |
          cargo +nightly fuzz coverage parse_stylesheet fuzz/corpus/parse_stylesheet
        working-directory: fuzz

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fuzz-coverage
          path: fuzz/coverage/
          if-no-files-found: ignore

      - name: Check for new findings
        id: findings
        run: |
          shopt -s nullglob
          findings=(fuzz/artifacts/parse_stylesheet/{crash,timeout,slow}-*)
          if [ ${#findings[@]} -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Found ${#findings[@]} artifact(s):"
            for f in "${findings[@]}"; do echo "  $f"; done
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No new findings."
          fi

      - name: Open PR with findings
        if: steps.findings.outputs.found == 'true'
        run: |
          git config user.name "Keith Cirkel"
          git config user.email "keithamus@users.noreply.github.com"

          BRANCH="fuzz/findings-$(date +%Y%m%d-%H%M%S)"
          git switch -c "$BRANCH"

          # Copy minimised artifacts into corpus and failed_files
          shopt -s nullglob
          for f in fuzz/artifacts/parse_stylesheet/{crash,timeout,slow}-*; do
            name="$(basename "$f")"
            cp "$f" "fuzz/corpus/parse_stylesheet/$name"
            cp "$f" "failed_files/$name.css"
          done

          git add fuzz/corpus/parse_stylesheet/ failed_files/
          git commit --message "fuzz: add new findings from nightly run $(date +%Y-%m-%d)"
          git push origin HEAD:"$BRANCH"

          gh pr create \
            --title "fuzz: new parser findings $(date +%Y-%m-%d)" \
            --body "Nightly fuzz run found new crash/timeout artifacts.

Each file in \`fuzz/corpus/parse_stylesheet/\` and \`failed_files/\` is a minimised reproducer.

**To reproduce locally:**
\`\`\`
cargo +nightly fuzz run parse_stylesheet fuzz/corpus/parse_stylesheet -- -max_total_time=60
\`\`\`

Fix the underlying bug, add a regression test, then merge.

GHA run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --head "$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GENERATE_VALUES_GITHUB_PAT }}
