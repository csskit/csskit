name: Lint

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: Check Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: global-rust-cache

      - name: Fmt
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: global-rust-cache

      - name: Clippy
        run: RUSTFLAGS="-Dwarnings" cargo clippy

  docs:
    name: Check Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: global-rust-cache

      - name: Docs
        run: cargo doc --all-features --no-deps
