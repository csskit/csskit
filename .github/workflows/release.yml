name: Release Automation (Including Automated PRs)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Test Automation"]
    types: [completed]
    branches: [main, release]

concurrency:
  group: "release"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  pull-requests: write
jobs:
  build:
    if: |
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.repository_owner == 'csskit' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            code-target: win32-x64

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            code-target: win32-arm64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            code-target: linux-x64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            code-target: linux-arm64

          - os: macos-latest
            target: x86_64-apple-darwin
            code-target: darwin-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            code-target: darwin-arm64

    name: Package ${{ matrix.code-target }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: release-${{ matrix.target }}

      - name: Rustup target
        run: rustup target add ${{ matrix.target }}

      - name: Install arm64 toolchain
        if: matrix.code-target == 'linux-arm64'
        run: sudo apt update && sudo apt install -y gcc-aarch64-linux-gnu

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }} -p csskit
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Archive Binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN_NAME=csskit-${{ matrix.code-target }}
          mv target/${{ matrix.target }}/release/csskit.exe $BIN_NAME.exe

      - name: Archive Binary
        if: runner.os != 'Windows'
        run: |
          BIN_NAME=csskit-${{ matrix.code-target }}
          mv target/${{ matrix.target }}/release/csskit $BIN_NAME

      - name: Set executable bit on binaries
        run: chmod +x csskit-*

      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: binary-${{ matrix.code-target }}
          path: csskit-*

  deploy:
    name: Deploy Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Copy binaries to platform packages
        run: |
          for artifact_dir in binary-*; do
            platform="${artifact_dir#binary-}"
            package_dir="packages/csskit-${platform}"
            mkdir -p "${package_dir}/bin"

            # Copy and rename binary to just 'csskit' or 'csskit.exe' for clean help text
            for binary in "${artifact_dir}"/*; do
              if [[ "$binary" == *.exe ]]; then
                cp "$binary" "${package_dir}/bin/csskit.exe"
              else
                cp "$binary" "${package_dir}/bin/csskit"
              fi
            done
          done

      - name: Ensure binaries are chmod +x
        run: chmod +x packages/csskit-*/bin/*

      - name: Print packages/ tree
        run: tree packages/

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Dependencies
        run: npm i
        working-directory: ./packages/csskit

      - name: Build wasm
        run: npm run build
        working-directory: ./packages/csskit

      - name: Release
        # SECURITY: mise tasks run with privileged secrets. This is safe only
        # because CODEOWNERS (* @keithamus) prevents merging .mise-tasks/
        # changes without explicit review. Do not relax CODEOWNERS.
        run: mise r release-automation
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_PR_PAT }}
