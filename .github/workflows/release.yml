name: Release Automation (Including Automated PRs)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Test Automation"]
    types: [completed]
    branches: [main, release]

concurrency:
  group: "release"
  cancel-in-progress: true
permissions:
  contents: write
  id-token: write
  pull-requests: write
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.repository_owner == 'csskit' &&
        github.event.workflow_run.head_branch == 'main'
      )

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            code-target: win32-x64

          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            code-target: win32-arm64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            code-target: linux-x64

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            code-target: linux-arm64

          - os: macos-26-intel
            target: x86_64-apple-darwin
            code-target: darwin-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            code-target: darwin-arm64

    name: Package ${{ matrix.code-target }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: release-${{ matrix.target }}
          tools: rust node npm npm:@napi-rs/cli
          components: ""

      - name: Rustup target
        run: rustup target add ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }} -p csskit

      - name: Build native addon
        working-directory: crates/csskit_napi
        run: napi build --release --target ${{ matrix.target }} --features napi

      - name: Stage native addon
        shell: bash
        run: cp crates/csskit_napi/*.node "csskit-${{ matrix.code-target }}.node"

      - name: Archive Binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN_NAME=csskit-${{ matrix.code-target }}
          mv target/${{ matrix.target }}/release/csskit.exe $BIN_NAME.exe

      - name: Archive Binary
        if: runner.os != 'Windows'
        run: |
          BIN_NAME=csskit-${{ matrix.code-target }}
          mv target/${{ matrix.target }}/release/csskit $BIN_NAME

      - name: Set executable bit on binaries
        run: chmod +x csskit-*

      - name: Upload Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: binary-${{ matrix.code-target }}
          path: csskit-*

  wasm:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.repository_owner == 'csskit' &&
        github.event.workflow_run.head_branch == 'main'
      )
    name: Package wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: release-wasm32-unknown-unknown
          tools: rust cargo:wasm-bindgen-cli aqua:WebAssembly/binaryen
          components: ""

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build wasm
        run: mise run build-csskit-wasm

      - name: Upload wasm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: wasm
          path: |
            packages/csskit/wasm.js
            packages/csskit/wasm.d.ts
            packages/csskit/csskit_wasm_bg.wasm
            packages/csskit/csskit_wasm_bg.wasm.d.ts
            packages/csskit/bundle/

  deploy:
    name: Deploy Release
    needs: [build, wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: release-deploy
          tools: rust node npm cargo:git-cliff
          components: ""

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*

      - name: Download wasm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm
          path: packages/csskit

      - name: Copy binaries to platform packages
        run: |
          for artifact_dir in binary-*; do
            platform="${artifact_dir#binary-}"
            package_dir="packages/csskit-${platform}"
            mkdir -p "${package_dir}/bin"

            # Copy the CLI binary to bin/, and the native addon to the package root
            for binary in "${artifact_dir}"/*; do
              if [[ "$binary" == *.node ]]; then
                cp "$binary" "${package_dir}/csskit.node"
              elif [[ "$binary" == *.exe ]]; then
                cp "$binary" "${package_dir}/bin/csskit.exe"
              else
                cp "$binary" "${package_dir}/bin/csskit"
              fi
            done
          done

      - name: Ensure binaries are chmod +x
        run: chmod +x packages/csskit-*/bin/*

      - name: Print packages/ tree
        run: tree packages/

      - name: Release
        # SECURITY: mise tasks run with privileged secrets. This is safe only
        # because CODEOWNERS (* @keithamus) prevents merging .mise-tasks/
        # changes without explicit review. Do not relax CODEOWNERS.
        run: mise r release-automation
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_PR_PAT }}
