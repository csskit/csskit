name: Release Automation (Including Automated PRs)

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
jobs:
  plan:
    name: Plan Release
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.plan.outputs.next }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: release-plan
          tools: rust cargo:git-cliff
          components: ""

      - name: Decide what to publish
        id: plan
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "csskit") | .version')
          NEXT=$(git cliff --bumped-version --unreleased)
          NEXT="${NEXT#v}"
          if [[ "$NEXT" == "$VERSION" ]]; then
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          PUBLISH=""
          PUBLISH_VERSION=""
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Not on main, skipping"
          elif ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is untagged, publishing release"
            PUBLISH=release
            PUBLISH_VERSION="$VERSION"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "Canaries are published nightly, skipping"
          else
            NEW_COMMITS=$(git rev-list --count HEAD --not "v$VERSION" 'canary^{commit}')
            echo "$NEW_COMMITS commits since last canary or v$VERSION"
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$NEW_COMMITS" -gt 0 ]]; then
              PUBLISH=canary
              PUBLISH_VERSION="$NEXT-canary.$(date -u +%Y%m%d%H%M)"
            fi
          fi
          echo "Next release: $NEXT, publishing: ${PUBLISH:-nothing} $PUBLISH_VERSION"
          {
            echo "next=$NEXT"
            echo "publish=$PUBLISH"
            echo "version=$PUBLISH_VERSION"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: plan
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.plan.outputs.publish != '') }}
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release-pr:
    name: Update Release PR
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish != 'release' && github.event_name != 'schedule' && (github.event_name == 'workflow_dispatch' || github.repository_owner == 'csskit')
    runs-on: ubuntu-latest
    concurrency:
      group: "release-pr"
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_PAT }}

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: release-pr
          tools: rust node npm cargo:git-cliff cargo:cargo-edit
          components: ""

      - name: Update Release PR
        run: mise r release-pr "$NEXT"
        env:
          NEXT: ${{ needs.plan.outputs.next }}
          GH_TOKEN: ${{ secrets.RELEASE_PR_PAT }}

  build:
    needs: [plan, test]
    if: ${{ !cancelled() && needs.plan.outputs.publish != '' && (github.event_name == 'workflow_dispatch' || github.repository_owner == 'csskit') && contains(fromJSON('["pass","skip"]'), needs.test.outputs.outcome) }}

    strategy:
      fail-fast: false
      matrix:
        artifact: [binary, addon]
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            code-target: win32-x64
            addon: csskit_napi.dll

          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            code-target: win32-arm64
            addon: csskit_napi.dll

          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            code-target: linux-x64
            addon: libcsskit_napi.so

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            code-target: linux-arm64
            addon: libcsskit_napi.so

          - os: macos-26-intel
            target: x86_64-apple-darwin
            code-target: darwin-x64
            addon: libcsskit_napi.dylib

          - os: macos-latest
            target: aarch64-apple-darwin
            code-target: darwin-arm64
            addon: libcsskit_napi.dylib

    name: Package ${{ matrix.platform.code-target }} ${{ matrix.artifact }}
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: release-${{ matrix.platform.target }}-${{ matrix.artifact }}
          tools: rust cargo:cargo-pgo ${{ matrix.artifact == 'addon' && 'node' || '' }}
          components: ""

      - name: Rustup target
        run: rustup target add ${{ matrix.platform.target }}

      - name: Build PGO-optimised ${{ matrix.artifact }}
        shell: bash
        run: .mise-tasks/build-release-pgo ${{ matrix.artifact }}

      - name: Stage native addon
        if: matrix.artifact == 'addon'
        shell: bash
        run: cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.addon }} "csskit-${{ matrix.platform.code-target }}.node"

      - name: Archive Binary
        if: matrix.artifact == 'binary' && runner.os == 'Windows'
        shell: bash
        run: |
          BIN_NAME=csskit-${{ matrix.platform.code-target }}
          mv target/${{ matrix.platform.target }}/release/csskit.exe $BIN_NAME.exe

      - name: Archive Binary
        if: matrix.artifact == 'binary' && runner.os != 'Windows'
        run: |
          BIN_NAME=csskit-${{ matrix.platform.code-target }}
          mv target/${{ matrix.platform.target }}/release/csskit $BIN_NAME

      - name: Set executable bit on binaries
        run: chmod +x csskit-*

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: ${{ matrix.artifact }}-${{ matrix.platform.code-target }}
          path: csskit-*

  wasm:
    needs: [plan, test]
    if: ${{ !cancelled() && needs.plan.outputs.publish != '' && (github.event_name == 'workflow_dispatch' || github.repository_owner == 'csskit') && contains(fromJSON('["pass","skip"]'), needs.test.outputs.outcome) }}
    name: Package wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: release-wasm32-unknown-unknown
          tools: rust cargo:wasm-bindgen-cli aqua:WebAssembly/binaryen
          components: ""

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build wasm
        run: mise run build-csskit-wasm

      - name: Upload wasm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: wasm
          path: |
            packages/csskit/wasm.js
            packages/csskit/wasm.d.ts
            packages/csskit/csskit_wasm_bg.wasm
            packages/csskit/csskit_wasm_bg.wasm.d.ts
            packages/csskit/bundle/

  publish-crates:
    name: Publish crates
    needs: [plan, build, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: "publish-crates"
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: release-crates
          tools: rust node npm cargo:cargo-edit
          components: ""

      - name: Set version
        # SECURITY: mise tasks run with an OIDC token able to publish. This is
        # safe only because CODEOWNERS (* @keithamus) prevents merging
        # .mise-tasks/ changes without explicit review. Do not relax CODEOWNERS.
        run: mise r set-version "$VERSION"

      - name: Set up Crates.io Trusted Publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: |
          set -o pipefail
          NAMES=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | .name')
          PACKAGES=()
          for name in $NAMES; do
            if curl -sf -A "csskit-release (https://github.com/csskit/csskit)" "https://crates.io/api/v1/crates/$name/$VERSION" >/dev/null; then
              echo "$name@$VERSION already published"
            else
              PACKAGES+=(-p "$name")
            fi
          done
          if (( ${#PACKAGES[@]} )); then
            cargo publish --allow-dirty "${PACKAGES[@]}"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-npm:
    name: Publish npm packages
    needs: [plan, build, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: "publish-npm"
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DIST_TAG: ${{ needs.plan.outputs.publish == 'release' && 'latest' || 'canary' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: release-npm
          tools: rust node npm cargo:cargo-edit
          components: ""

      - name: Download native artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{binary,addon}-*"

      - name: Download wasm artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm
          path: packages/csskit

      - name: Copy binaries to platform packages
        run: |
          for artifact_dir in binary-* addon-*; do
            platform="${artifact_dir#*-}"
            package_dir="packages/csskit-${platform}"
            mkdir -p "${package_dir}/bin"

            # Copy the CLI binary to bin/, and the native addon to the package root
            for binary in "${artifact_dir}"/*; do
              if [[ "$binary" == *.node ]]; then
                cp "$binary" "${package_dir}/csskit.node"
              elif [[ "$binary" == *.exe ]]; then
                cp "$binary" "${package_dir}/bin/csskit.exe"
              else
                cp "$binary" "${package_dir}/bin/csskit"
              fi
            done
          done

      - name: Ensure binaries are chmod +x
        run: chmod +x packages/csskit-*/bin/*

      - name: Print packages/ tree
        run: tree packages/

      - name: Set version
        # SECURITY: see publish-crates.
        run: mise r set-version "$VERSION"

      - name: Publish
        run: |
          for pkg in packages/csskit-*/ packages/csskit/; do
            name="$(basename "$pkg")"
            if [[ -n "$(npm view "$name@$VERSION" version 2>/dev/null)" ]]; then
              echo "$name@$VERSION already published"
            else
              npm publish "$pkg" --provenance --tag "$DIST_TAG" --access public
            fi
          done

  github-release:
    name: GitHub Release
    needs: [plan, publish-crates, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: "github-release"
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download native artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{binary,addon}-*"

      - name: Create release
        if: needs.plan.outputs.publish == 'release'
        id: release
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            HEADLINE=$(gh pr list --state merged --head "release-v$VERSION" --json body --jq '.[0].body // ""' | .mise-tasks/release-headline)
            NOTES=()
            if [[ -n "$HEADLINE" ]]; then
              NOTES=(--notes "$(printf '## Headline Changes\n\n%s\n' "$HEADLINE")")
            fi
            gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes "${NOTES[@]}" binary-*/* addon-*/*
          fi
          RELEASE=$(gh release view "v$VERSION" --json name,url,body)
          BODY=$(jq -r .body <<< "$RELEASE")
          HEADLINE=$(.mise-tasks/release-headline <<< "$BODY")
          if (( ${#HEADLINE} > 1900 )); then
            HEADLINE=""
          fi
          {
            echo "name=$(jq -r .name <<< "$RELEASE")"
            echo "url=$(jq -r .url <<< "$RELEASE")"
            echo "body<<RELEASE_NOTES_EOF"
            if [[ -n "$HEADLINE" ]]; then
              .mise-tasks/release-headline --strip <<< "$BODY"
            else
              echo "$BODY"
            fi
            echo "RELEASE_NOTES_EOF"
            echo "content<<RELEASE_CONTENT_EOF"
            if [[ -n "$HEADLINE" ]]; then
              printf '%s\n\n' "$HEADLINE"
            fi
            echo "||@everyone||"
            echo "RELEASE_CONTENT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update canary release
        if: needs.plan.outputs.publish == 'canary'
        run: |
          git tag -f canary "$GITHUB_SHA"
          git push --force origin refs/tags/canary
          gh release upload canary binary-*/* addon-*/* --clobber

      - name: Post release notes to Discord
        if: needs.plan.outputs.publish == 'release'
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          release_name: ${{ steps.release.outputs.name }}
          release_body: ${{ steps.release.outputs.body }}
          release_html_url: ${{ steps.release.outputs.url }}
          color: "2105893"
          username: "Release Changelog"
          avatar_url: "https://csskit.rs/images/android-chrome-512x512.png"
          content: ${{ steps.release.outputs.content }}
          footer_title: "Changelog"
          reduce_headings: true
