name: Test Automation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

jobs:
  check-skip:
    name: Check if build is needed
    runs-on: ubuntu-latest
    outputs:
      skip-build: ${{ steps.check.outputs.skip-build }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check if build-relevant files changed
        id: check
        run: |
          # Check for [forcebuild] flag in commit message
          if git log --format=%B -n 1 HEAD | grep -qiE '\[forcebuild\]'; then
            echo "skip-build=false" >> $GITHUB_OUTPUT
            echo "[forcebuild] found, running builds"
          # On initial commit HEAD~1 doesn't exist - always build
          elif ! git rev-parse --verify HEAD~1 > /dev/null 2>&1; then
            echo "skip-build=false" >> $GITHUB_OUTPUT
            echo "Initial commit, running builds"
          # Check if any build-relevant files were changed
          elif git diff --name-only HEAD~1 HEAD | grep -qE '\.(rs|toml|css|snap)$|^\.github/|^mise-tasks/|^coverage/|^Cargo\.lock$'; then
            echo "skip-build=false" >> $GITHUB_OUTPUT
            echo "Build-relevant files changed, running builds"
          else
            echo "skip-build=true" >> $GITHUB_OUTPUT
            echo "No build-relevant files changed, skipping builds"
          fi

  build:
    name: Build & Test on ${{ matrix.code-target }}
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            code-target: win32-x64

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            code-target: win32-arm64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            code-target: linux-x64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            code-target: linux-arm64

          - os: macos-latest
            target: x86_64-apple-darwin
            code-target: darwin-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            code-target: darwin-arm64

    steps:
      - name: Configure git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: test-${{ matrix.target }}

      - name: Test
        run: cargo test --all-features

  build_default:
    name: Build & Test with default features
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: cargo test

  build_nightly:
    name: Build & Test with nightly
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          nightly: "true"

      - name: Test
        run: cargo +nightly test --all-features

  build_each_lib:
    name: Build each library to check independent errors
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: set -euo pipefail; for d in crates/*/; do cargo build -p $(basename $d); done

  acceptance:
    name: Acceptance Tests
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run acceptance tests
        run: mise r csskit-acceptance

  fuzz_replay:
    name: Fuzz Corpus Replay
    needs: check-skip
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check if fuzz files changed
        id: check-fuzz
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -q '^fuzz/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup
        if: steps.check-fuzz.outputs.changed == 'true'
        uses: ./.github/actions/setup
        with:
          nightly: "true"

      - name: Replay corpus
        if: steps.check-fuzz.outputs.changed == 'true'
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run parse_stylesheet corpus/parse_stylesheet \
            --target x86_64-unknown-linux-gnu \
            -- -runs=0

  deploy-dryrun:
    name: Deploy Dry Run
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: deploy-dryrun

      - name: Set canary version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version | split(".") | "\(.[0]).\(.[1]).\(.[2] | tonumber + 1)"')
          echo "TAG_NAME=${VERSION}-canary.${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Bump workspace version
        run: cargo set-version --workspace $TAG_NAME

      - name: Dry run publish
        run: cargo publish --workspace --dry-run --allow-dirty

  results:
    name: CI Results
    if: always()
    needs: [check-skip, build, build_default, build_nightly, build_each_lib, acceptance, fuzz_replay]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check Results
        run: |
          if [[ "${{ needs.check-skip.outputs.skip-build }}" == "true" ]]; then
            echo "Build jobs were skipped (no build-relevant files changed)";
            if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
              gh pr review ${{ github.event.number }} --approve --body "All CI jobs have passed. Approving. (Build jobs were skipped - no build-relevant files changed)" || true;
            fi
            exit 0;
          fi
          outcome='${{ toJSON(needs.*.result) }}'
          if [[ $(echo $outcome | jq -e 'all(. == "success")') != "true" ]]; then
            echo "Some required steps failed!";
            if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
              gh pr review ${{ github.event.number }} --request-changes --body "Some required steps failed!" || true;
            fi
            exit 1;
          elif [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            gh pr review ${{ github.event.number }} --approve --body "All CI jobs have passed. Approving." || true;
          fi
