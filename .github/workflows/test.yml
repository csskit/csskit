name: Test Automation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check-skip:
    name: Check if build is needed
    runs-on: ubuntu-latest
    outputs:
      skip-build: ${{ steps.check.outputs.skip-build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if build-relevant files changed
        id: check
        run: |
          # Check for [forcebuild] flag in commit message
          if git log --format=%B -n 1 HEAD | grep -qiE '\[forcebuild\]'; then
            echo "skip-build=false" >> $GITHUB_OUTPUT
            echo "[forcebuild] found, running builds"
          # On initial commit HEAD~1 doesn't exist - always build
          elif ! git rev-parse --verify HEAD~1 > /dev/null 2>&1; then
            echo "skip-build=false" >> $GITHUB_OUTPUT
            echo "Initial commit, running builds"
          # Check if any build-relevant files were changed
          elif git diff --name-only HEAD~1 HEAD | grep -qE '\.(rs|toml|css|snap)$|^\.github/|^mise-tasks/|^coverage/|^packages/|^Cargo\.lock$'; then
            echo "skip-build=false" >> $GITHUB_OUTPUT
            echo "Build-relevant files changed, running builds"
          else
            echo "skip-build=true" >> $GITHUB_OUTPUT
            echo "No build-relevant files changed, skipping builds"
          fi

  build:
    name: Build & Test on ${{ matrix.code-target }}
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            code-target: win32-x64

          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            code-target: win32-arm64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            code-target: linux-x64

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            code-target: linux-arm64

          - os: macos-26-intel
            target: x86_64-apple-darwin
            code-target: darwin-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            code-target: darwin-arm64

    steps:
      - name: Configure git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: test-${{ matrix.target }}
          tools: rust
          components: ""

      - name: Test
        run: cargo test --all-features

  build_default:
    name: Build & Test with default features
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          tools: rust
          components: ""

      - name: Test
        run: cargo test

  build_nightly:
    name: Build & Test with nightly
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          nightly: "true"
          tools: rust
          components: ""

      - name: Test
        run: cargo +nightly test --all-features

  build_each_lib:
    name: Build each library to check independent errors
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          tools: rust
          components: ""

      - name: Build
        run: set -euo pipefail; for d in crates/*/ tools/*/; do pkg=$(cargo metadata --no-deps --manifest-path $d/Cargo.toml --format-version 1 2>/dev/null | jq -r '.packages[0].name'); cargo build -p $pkg; done

  build_benches:
    name: Build benches
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          tools: rust
          components: ""

      - name: Build
        run: cargo build --benches

  acceptance:
    name: Acceptance Tests
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          tools: rust
          components: ""

      - name: Run acceptance tests
        run: mise r csskit-acceptance

  fuzz_replay:
    name: Fuzz Corpus Replay
    needs: check-skip
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if fuzz files changed
        id: check-fuzz
        run: |
          git fetch origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -q '^fuzz/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup
        if: steps.check-fuzz.outputs.changed == 'true'
        uses: ./.github/actions/setup
        with:
          nightly: "true"
          tools: rust cargo:cargo-fuzz
          components: ""

      - name: Replay corpus
        if: steps.check-fuzz.outputs.changed == 'true'
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run parse_stylesheet corpus/parse_stylesheet \
            --target x86_64-unknown-linux-gnu \
            -- -runs=0

  deploy-dryrun:
    name: Deploy Dry Run
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: deploy-dryrun
          tools: rust cargo:cargo-edit
          components: ""

      - name: Set canary version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version | split(".") | "\(.[0]).\(.[1]).\(.[2] | tonumber + 1)"')
          echo "TAG_NAME=${VERSION}-canary.${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Bump workspace version
        run: cargo set-version --workspace $TAG_NAME

      - name: Dry run publish
        run: cargo publish --workspace --dry-run --allow-dirty

  build_wasm:
    name: Wasm Build & JS Tests
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: test-wasm32-unknown-unknown
          tools: rust node npm cargo:wasm-bindgen-cli aqua:WebAssembly/binaryen
          components: ""

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build wasm and run JS tests
        run: mise r test-wasm

  test_napi:
    name: Napi Addon & JS Tests
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: test-napi
          tools: rust node npm
          components: ""

      - name: Build addon and run native object model tests
        run: mise r test-napi

  generated_files:
    name: Generated File Drift
    needs: check-skip
    if: needs.check-skip.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"

      - name: Setup
        uses: ./.github/actions/setup
        with:
          key: generated-files
          tools: rust
          components: ""

      - name: Regenerate node classes
        run: mise run generate-node-classes

      - name: Check for drift
        run: git diff --exit-code -- packages/csskit/nodes.js packages/csskit/nodes.d.ts

  results:
    name: CI Results
    if: always()
    needs: [check-skip, build, build_default, build_nightly, build_each_lib, build_benches, acceptance, fuzz_replay, build_wasm, test_napi, generated_files]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Results
        id: check
        run: |
          SKIPPED="${{ needs.check-skip.outputs.skip-build }}"
          NEEDS='${{ toJSON(needs) }}'

          # Build a status table for the PR comment
          declare -A JOB_NAMES=(
            [build]="Build & Test (win32-x64, win32-arm64, linux-x64, linux-arm64, darwin-x64, darwin-arm64)"
            [build_default]="Build & Test (default features)"
            [build_nightly]="Build & Test (nightly)"
            [build_each_lib]="Build each library"
            [build_benches]="Build benches"
            [acceptance]="Acceptance Tests"
            [fuzz_replay]="Fuzz Corpus Replay"
            [build_wasm]="Wasm Build & JS Tests"
            [test_napi]="Napi Addon & JS Tests"
            [generated_files]="Generated File Drift"
          )

          TABLE="| Job | Result |\n|---|---|\n"
          FAILED_JOBS=""

          for job in build build_default build_nightly build_each_lib build_benches acceptance fuzz_replay build_wasm test_napi generated_files; do
            result=$(echo "$NEEDS" | jq -r ".${job}.result // \"skipped\"")
            name="${JOB_NAMES[$job]}"
            case "$result" in
              success) icon=":white_check_mark:" ;;
              skipped) icon=":white_circle:" ;;
              *)       icon=":x:"; FAILED_JOBS="${FAILED_JOBS}\n- **${name}**" ;;
            esac
            TABLE="${TABLE}| ${name} | ${icon} ${result} |\n"
          done

          if [[ "$SKIPPED" == "true" ]]; then
            BODY="### :white_circle: CI skipped\n\nNo build-relevant files changed.\n\n${TABLE}"
            echo "outcome=skip" >> $GITHUB_OUTPUT
          elif [[ -n "$FAILED_JOBS" ]]; then
            BODY="### :x: CI failed\n\nThe following jobs failed:\n${FAILED_JOBS}\n\n${TABLE}\n\n[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "outcome=fail" >> $GITHUB_OUTPUT
          else
            BODY="### :white_check_mark: CI passed\n\n${TABLE}"
            echo "outcome=pass" >> $GITHUB_OUTPUT
          fi

          # Export body for comment step
          {
            echo "RESULTS_BODY<<EOF"
            printf '%b' "$BODY"
            echo "EOF"
          } >> $GITHUB_ENV

          # Log for the Actions console
          printf '%b\n' "$BODY"

          # Fail the job if there were failures
          [[ -z "$FAILED_JOBS" ]]

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/github-comment
        with:
          issue-number: ${{ github.event.number }}
          body: ${RESULTS_BODY}
