[tools]
rust = { version = "1.97.1", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
node = "26.5.1"
npm = "12.0.2"
hyperfine = "latest"
"cargo:cargo-insta" = "1.46.3"
"cargo:cargo-expand" = "1.0.124"
"cargo:cargo-edit" = "0.13.13"
"cargo:git-cliff" = "2.10.1"
"cargo:samply" = "0.13.1"
"cargo:wasm-bindgen-cli" = "0.2.126"
"aqua:WebAssembly/binaryen" = "131"
"cargo:cargo-fuzz" = "0.13.2"

[tasks.clean]
confirm = 'Are you sure?'
description = "Clean all build artefacts"
run = ["cargo clean", "rm ./tasks/generate-values/.*-cache.txt"]

[tasks.build]
description = "Build all project files"
sources = ["Cargo.toml", "crates/**/*.toml", "crates/**/*.rs"]
outputs = ["target/debug/csskit"]
run = "cargo build --all-features"
alias = "b"

[tasks.build-release]
description = "Build release"
sources = ["Cargo.toml", "crates/**/*.toml", "crates/**/*.rs"]
outputs = ["target/release/csskit"]
run = "cargo build --all-features --release"

[tasks.build-release-debug]
description = "Build release-debug"
sources = ["Cargo.toml", "crates/**/*.toml", "crates/**/*.rs"]
outputs = ["target/release-debug/csskit"]
run = "cargo build --all-features --profile release-debug"

[tasks.test]
description = "Run the test suite"
sources = ["Cargo.toml", "crates/**/*.toml", "crates/**/*.rs"]
run = "cargo test --all-features"
alias = "t"

[tasks.bench]
description = "Run the benchmark suite"
run = "cargo bench --all-features"

[tasks.lint]
description = "Lint all project files"
sources = ["Cargo.toml", "crates/**/*.toml", "crates/**/*.rs"]
run = ["cargo clippy --workspace --all-targets --all-features"]

[tasks.doc]
description = "Generate library documentation"
sources = ["Cargo.toml", "crates/**/*.toml", "crates/**/*.rs"]
run = "cargo doc --all-features"

[tasks.generate-feature-data]
description = "Run code generation to build CSS feature data"
run = ["cargo run -p csskit_spec_generator generate-feature-data"]

[tasks.generate-values]
description = "Run code generation to build all CSS style values"
run = ["cargo run -p csskit_spec_generator generate-spec {{arg(name='spec')}}"]

[tasks.generate-all-values]
description = "Run code generation to build all CSS style values"
run = ["cargo run -p csskit_spec_generator generate-all"]

[tasks.generate-property-atoms]
description = "Generate property_atoms.rs from CSS specs"
run = ["cargo run -p csskit_spec_generator generate-property-atoms"]

[tasks.generate-sized-types]
description = "Generate the sized-types table from the css_ast source"
run = ["REGENERATE_SIZED_TYPES=1 cargo test -p csskit_source_finder --test sized_types"]

[tasks.fuzz]
description = "Run the fuzzer (Ctrl-C to stop)"
dir = "{{config_root}}/fuzz"
run = "cargo +nightly fuzz run parse_stylesheet corpus/parse_stylesheet --target x86_64-unknown-linux-gnu -- -max_len=4096 -artifact_prefix=artifacts/parse_stylesheet/"

[tasks.profile]
depends = ["build -p csskit --profile release-debug"]
description = "Run a given file in the profiler to analyse performance"
run = "samply record --rate=10000 ./target/release-debug/csskit build {{arg(name='css_file')}} --output /dev/null"
