# Properties that require manual Parse implementations instead of generated ones.
#
# Some properties have complex parsing rules that make them difficult or impractical
# to express using the derive(Parse) macro. For these properties, we exclude Parse
# from the generated derive list, allowing developers to provide custom implementations.

[writing-modes]
# Properties with hand-written Parse implementations
# glyph-orientation-vertical: Requires special handling for literal integers and dimensions
properties = ["glyph-orientation-vertical"]

[transforms]
# transform-origin: raw spec grammar produces ~25 colliding variants after distribution;
# hand-written Parse using PositionOne/PositionHorizontal/PositionVertical is cleaner.
# rotate: `[ x | y | z | <number>{3} ] && <angle>` is order-independent, but the distributed
# variants are shadowed by the earlier bare `<angle>` alternative during enum dispatch.
properties = ["transform-origin", "rotate"]

[grid]
# grid-template-columns/rows: needs to try_parse, so it can backtrack for ambiguous
# repeat functions.
properties = ["grid-template-columns", "grid-template-rows"]

[speech]
properties = ["voice-pitch", "voice-range"]
