]
writes = [
    { property = "background-color", optional = true },
    { property = "background-image", optional = true },
    { property = "background-position", optional = true },
    { property = "background-size", optional = true, before = "/" },
    { property = "background-repeat", optional = true },
    { property = "background-attachment", optional = true },
    { property = "background-origin", optional = true },
    { property = "background-clip", optional = true, copies = true },
]

