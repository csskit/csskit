# Properties that are known shorthands, that expand into various longhand properties.
# All shorthands must specify their constituent longhand properties.
#
# A shorthand also states which longhand each value of its grammar sets, as `writes`:
#
#   writes = "any"     one optional value per longhand, in `longhands` order, as `border`'s
#                      `<'border-width'> || <'border-style'> || <'border-color'>` writes.
#   writes = "repeat"  one to as many values as there are longhands; the position of each value
#                      picks the longhand in `longhands` order, and a left-out position takes the
#                      value of an earlier one, as `margin`'s `<'margin-top'>{1,4}` does.
#   writes = "same"    the one value the grammar takes sets every longhand, as `marker`'s
#                      `none | <url>` does.
#   writes = [ { property = "...", optional = true, before = "/" }, ... ]
#                      the slots stated one by one, in the order the grammar writes them, for a
#                      grammar the keywords cannot state, such as `font`'s. `before` and `after`
#                      are the tokens the grammar writes around a slot, and `optional` marks a
#                      value that may be left out to state the initial value of its property.
#
# Stated slots must cover every longhand the shorthand sets; generation fails if one is left out.
# A shorthand whose values cannot be read as one value per longhand - a layer list such as
# `background`, or a grammar which chooses between shapes such as `grid` - states no `writes`.

[[shorthand]]
name = "all"
# Special case: affects all CSS properties except unicode-bidi, direction, and custom properties
resets_all = true
longhands = []

[[shorthand]]
name = "animation"
longhands = [
    "animation-name",
    "animation-duration",
    "animation-timing-function",
    "animation-delay",
    "animation-iteration-count",
    "animation-direction",
    "animation-fill-mode",
    "animation-play-state",
]
resets = ["animation-range", "animation-timeline"]
writes = [
    { property = "animation-name", optional = true },
    { property = "animation-duration", optional = true },
    { property = "animation-timing-function", optional = true },
    { property = "animation-delay", optional = true },
    { property = "animation-iteration-count", optional = true },
    { property = "animation-direction", optional = true },
    { property = "animation-fill-mode", optional = true },
    { property = "animation-play-state", optional = true },
]

